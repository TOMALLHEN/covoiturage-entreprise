name: covoiturage-entreprise

services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_DB: covoiturage
      POSTGRES_USER: covoiturage
      POSTGRES_PASSWORD: covoiturage_dev
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - donnees_postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U covoiturage -d covoiturage"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  donnees_postgres: