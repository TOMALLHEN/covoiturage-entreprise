spring.application.name=covoiturage-api

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/covoiturage}
spring.datasource.username=${DB_USER:covoiturage}
spring.datasource.password=${DB_PASSWORD:covoiturage_dev}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.flyway.enabled=false
spring.sql.init.mode=never